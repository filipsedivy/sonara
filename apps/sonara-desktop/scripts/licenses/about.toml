# cargo-about's configuration for the bundle's crate licences (LIC-01). scripts/stage-licenses.mjs runs `cargo about generate --format json` with it,
# once for each executable the bundle ships (sonara-desktop and the sonara CLI).

# deny.toml's allow-list, in its order, plus MPL-2.0 for the crates deny.toml lists as
# exceptions (cargo deny enforces which ones). For a choice such as "MIT OR Apache-2.0" the first
# accepted licence in this list is the one reproduced.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
]

# The product: macOS on Apple Silicon. Without this, Tauri's Linux tree would be listed.
targets = ["aarch64-apple-darwin"]

# Only code that ships: no dev-dependencies, and no build scripts or their dependencies.
# Procedural macros are normal dependencies and stay listed.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Sonara's own crates are proprietary and unpublished (LICENSE).
private = { ignore = true }
