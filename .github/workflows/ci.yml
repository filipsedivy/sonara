# CI for the Rust workspace and the desktop frontend.
# The product targets macOS on Apple Silicon; Linux runs inside the development container.
# Third-party actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bench:
        description: Also run the benchmarks (informational numbers, never a gate; HW-01)
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    shell: bash

jobs:
  versions:
    name: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace's version is the only one: the desktop's tauri.conf.json and package.json
      # carry none.
      - name: All versions are equal (VER-01)
        run: scripts/check-versions.sh

  rust:
    name: rust (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Golden data lives in Git LFS; the cache keeps CI from re-downloading it every run.
      - name: List golden LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
      - name: Pull golden data
        run: git lfs pull
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # libsoxr and LAME are loaded at run time (R1 and R2) from target/native/lib
      # (SONARA_NATIVE_LIB_DIR, .cargo/config.toml): the recording's builds, from pinned sources
      # with the runner's cmake. Cached under the script's hash; the script skips an up-to-date
      # build. This cache comes after rust-cache so that it saves target/native before
      # rust-cache's post step prunes target/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/native
          key: native-codecs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native/build-codecs.sh', 'scripts/native/*.patch') }}
      - name: Codec libraries (libsoxr a66f3ee, LAME 3.100, libFLAC 1.4.3)
        run: scripts/native/build-codecs.sh
      # The workspace includes the desktop crate here. Tauri's code generation needs no
      # built frontend for these debug builds: without the `custom-protocol` feature, which only
      # the Tauri CLI's bundling enables, it serves `devUrl` and embeds no assets (checked
      # 2026-10-22).
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Also checks that docs/agent-api.md is up to date: the test of sonara-agent's
      # gen_agent_docs example (`test = true`), which renders it from the tool registry.
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The same commands as `scripts/dev.sh rust-rtsan` (docker/dev/tasks.sh).
      - name: RealtimeSanitizer
        run: |
          cargo test --locked -p sonara-rt -p sonara-io --features sonara-rt/rtsan,sonara-io/rtsan
          cargo test --locked -p sonara-engine --features sonara-engine/rtsan,sonara-io/rtsan --test player --test live
          cargo test --locked -p sonara-app --features sonara-engine/rtsan,sonara-io/rtsan --test transport --test transport_state
        env:
          RTSAN_ENABLE: "1"

  # The Linux leg runs in the development container, like local development.
  rust-linux:
    name: rust (ubuntu-24.04, dev container)
    runs-on: ubuntu-24.04
    env:
      SONARA_DEV_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Golden data lives in Git LFS; the cache keeps CI from re-downloading it every run.
      - name: List golden LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
      - name: Pull golden data
        run: git lfs pull
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/dev/Dockerfile
          tags: sonara-dev:local
          load: true
          cache-from: type=gha,scope=sonara-dev
          cache-to: type=gha,scope=sonara-dev,mode=max
      # Without the desktop crate, which needs WebKitGTK on Linux; cargo deny checks its tree.
      - name: fmt, clippy, test, doc
        run: scripts/dev.sh rust-check
      - name: cargo deny (licences, advisories, bans, sources)
        run: scripts/dev.sh rust-deny
      - name: loom
        run: scripts/dev.sh rust-loom
      - name: RealtimeSanitizer
        run: scripts/dev.sh rust-rtsan

  # The desktop frontend, in the development container: the frozen
  # pnpm install, the licence gate, svelte-check, the Vite build and the Playwright tests in WebKit.
  frontend:
    name: frontend (ubuntu-24.04, dev container)
    runs-on: ubuntu-24.04
    env:
      SONARA_DEV_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/dev/Dockerfile
          tags: sonara-dev:local
          load: true
          cache-from: type=gha,scope=sonara-dev
          cache-to: type=gha,scope=sonara-dev,mode=max
      - name: install, licences, svelte-check, build, tests
        run: scripts/dev.sh frontend

  build:
    name: build (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The desktop application is built and bundled by the Tauri CLI (release.yml);
      # a plain cargo build of it would serve the development URL.
      - name: Release build of the applications
        run: cargo build --locked --release --workspace --exclude sonara-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonara-macos-arm64
          path: target/release/sonara

  # The benchmarks, manual only: a run of this workflow with "bench" ticked. Runner numbers
  # are informational and never gate (HW-01); the job fails only when a benchmark itself fails.
  # `inputs.bench` is empty when release.yml calls this workflow, so its runs never benchmark.
  bench:
    name: bench (macos-26)
    if: inputs.bench
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # As in the rust job: the codec libraries, which the export of the 8-track case loads at
      # run time. Cached after rust-cache, so that it saves target/native before rust-cache's
      # post step prunes target/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/native
          key: native-codecs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native/build-codecs.sh', 'scripts/native/*.patch') }}
      - name: Codec libraries (libsoxr a66f3ee, LAME 3.100, libFLAC 1.4.3)
        run: scripts/native/build-codecs.sh
      - name: criterion benches
        run: cargo bench --locked --workspace --bench '*'
      # The Rust counterpart of scripts/bench.py: render, save, open and export times as JSON.
      - name: Render benchmark (quick cases)
        run: cargo run --locked --release -p sonara-agent --example bench -- --quick >bench.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-macos-arm64
          path: |
            bench.json
            target/criterion
          if-no-files-found: error
