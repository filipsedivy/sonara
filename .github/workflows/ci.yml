# CI for the Rust workspace and the desktop frontend.
# The product targets macOS on Apple Silicon; every job runs natively on macOS runners (owner
# decision, 2026-10-24: the Linux development container is gone, native throughout).
# Third-party actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bench:
        description: Also run the benchmarks (informational numbers, never a gate; HW-01)
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  # The frontend's toolchain (also pinned in release.yml and apps/sonara-desktop/package.json's
  # packageManager). The checksum is the one nodejs.org publishes for the darwin-arm64 tarball.
  NODE_VERSION: 26.12.1
  NODE_SHA256: 18830bf448fe187c650dc28c98aa8c968ed1d40b6dd032c081e70a384a1bf660
  PNPM_VERSION: 12.14.0

defaults:
  run:
    shell: bash

jobs:
  versions:
    name: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace's version is the only one: the desktop's tauri.conf.json and package.json
      # carry none.
      - name: All versions are equal (VER-01)
        run: scripts/check-versions.sh

  rust:
    name: rust (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Golden data lives in Git LFS; the cache keeps CI from re-downloading it every run.
      - name: List golden LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
      - name: Pull golden data
        run: git lfs pull
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # libsoxr and LAME are loaded at run time (R1 and R2) from target/native/lib
      # (SONARA_NATIVE_LIB_DIR, .cargo/config.toml): the recording's builds, from pinned sources
      # with the runner's cmake. Cached under the script's hash; the script skips an up-to-date
      # build. This cache comes after rust-cache so that it saves target/native before
      # rust-cache's post step prunes target/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/native
          key: native-codecs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native/build-codecs.sh', 'scripts/native/*.patch') }}
      - name: Codec libraries (libsoxr a66f3ee, LAME 3.100, libFLAC 1.4.3)
        run: scripts/native/build-codecs.sh
      # The workspace includes the desktop crate here. Tauri's code generation needs no
      # built frontend for these debug builds: without the `custom-protocol` feature, which only
      # the Tauri CLI's bundling enables, it serves `devUrl` and embeds no assets (checked
      # 2026-10-22).
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Also checks that docs/agent-api.md is up to date: the test of sonara-agent's
      # gen_agent_docs example (`test = true`), which renders it from the tool registry.
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # cargo-deny: licences, advisories, bans and sources (QG-10). rust-cache above covers
      # ~/.cargo/bin, so a version change is the only time this recompiles.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny --locked check
      - name: loom (sonara-rt protocols over every thread interleaving, RT-04)
        run: cargo test --locked -p sonara-rt --release
        env:
          RUSTFLAGS: --cfg loom
      # The same commands as `scripts/dev.sh rust-rtsan`.
      - name: RealtimeSanitizer
        run: |
          cargo test --locked -p sonara-rt -p sonara-io --features sonara-rt/rtsan,sonara-io/rtsan
          cargo test --locked -p sonara-engine --features sonara-engine/rtsan,sonara-io/rtsan --test player --test live
          cargo test --locked -p sonara-app --features sonara-engine/rtsan,sonara-io/rtsan --test transport --test transport_state
        env:
          RTSAN_ENABLE: "1"

  # The desktop frontend, natively on macOS (its target platform, ADR 0009): the frozen pnpm
  # install, the licence gate, svelte-check, the Vite build and the Playwright tests in WebKit.
  frontend:
    name: frontend (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # As in release.yml's bundle job: Node and pnpm from the official tarball, its SHA-256
      # checked.
      - name: Node and pnpm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node" --strip-components 1
          echo "$RUNNER_TEMP/node/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/node/bin/npm" install --global --no-fund --no-audit "pnpm@${PNPM_VERSION}"
          "$RUNNER_TEMP/node/bin/node" --version
      - name: pnpm install (frozen)
        working-directory: apps/sonara-desktop
        run: pnpm install --frozen-lockfile
      # Playwright's WebKit build for the "page" project's tests; its version is
      # @playwright/test in package.json. Cached by that version, since a fresh download is slow.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-macos-${{ hashFiles('apps/sonara-desktop/package.json') }}
      - name: Playwright's WebKit
        working-directory: apps/sonara-desktop
        run: pnpm exec playwright install webkit
      - name: licences, svelte-check, build, tests
        working-directory: apps/sonara-desktop
        run: |
          pnpm run check:licenses
          pnpm run check
          pnpm run build
          pnpm run test

  build:
    name: build (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The desktop application is built and bundled by the Tauri CLI (release.yml);
      # a plain cargo build of it would serve the development URL.
      - name: Release build of the applications
        run: cargo build --locked --release --workspace --exclude sonara-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonara-macos-arm64
          path: target/release/sonara

  # The benchmarks, manual only: a run of this workflow with "bench" ticked. Runner numbers
  # are informational and never gate (HW-01); the job fails only when a benchmark itself fails.
  # `inputs.bench` is empty when release.yml calls this workflow, so its runs never benchmark.
  bench:
    name: bench (macos-26)
    if: inputs.bench
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # As in the rust job: the codec libraries, which the export of the 8-track case loads at
      # run time. Cached after rust-cache, so that it saves target/native before rust-cache's
      # post step prunes target/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/native
          key: native-codecs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native/build-codecs.sh', 'scripts/native/*.patch') }}
      - name: Codec libraries (libsoxr a66f3ee, LAME 3.100, libFLAC 1.4.3)
        run: scripts/native/build-codecs.sh
      - name: criterion benches
        run: cargo bench --locked --workspace --bench '*'
      # The Rust counterpart of scripts/bench.py: render, save, open and export times as JSON.
      - name: Render benchmark (quick cases)
        run: cargo run --locked --release -p sonara-agent --example bench -- --quick >bench.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-macos-arm64
          path: |
            bench.json
            target/criterion
          if-no-files-found: error
