# Keeps pinned actions, crates and the frontend's npm packages current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/sonara-desktop
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
