# cargo-deny policy for the Rust workspace: licences, advisories, bans and sources (QG-10).
# Run with `scripts/dev.sh rust-deny`.

[graph]
# Check every feature (including the optional `rtsan` dependencies) on every supported target.
all-features = true
# The product targets macOS on Apple Silicon and is never built for Linux; these stay listed so
# that dependency licences reachable only on Linux (for example Tauri's GTK/WebKitGTK tree) are
# still checked.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# Every advisory fails the check, including unmaintained crates. An exception needs a reason.
ignore = [
    # proc-macro-error 1.0.4 is unmaintained. It is reached only through Tauri's Linux tree
    # (tauri → tao/wry/muda → gtk/webkit2gtk → glib → glib-macros 0.18), at build time only,
    # and is never built for the macOS product. gtk-rs 0.18 is the last GTK 3 line, so no
    # upgrade exists. Owner decision, 2026-10-22.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, Linux-only Tauri tree; never built for macOS; no upgrade (owner, 2026-10-22)" },
]

[licenses]
# Permissive licences only. GPL, AGPL and LGPL are never allowed; a licence that is not
# listed here (for example MPL-2.0) needs the owner's decision before it is added (QG-10).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# MPL-2.0 crates, used unmodified (owner decision, LIC-01); a modified MPL
# file is not allowed. Every crate is listed on its own, so a new MPL dependency fails the check.
exceptions = [
    # symphonia: decoding in sonara-media.
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-flac" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-mp3" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-vorbis" },
    # CAF ALAC import: LIC-01 allows unmodified MPL crates, and the
    # owner closed the format gaps for full parity on 2026-10-24.
    { allow = ["MPL-2.0"], crate = "symphonia-codec-alac" },
    { allow = ["MPL-2.0"], crate = "symphonia-common" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-ogg" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
    # Tauri 2.12, the desktop application.
    # Linked into the binary: tauri -> dirs -> dirs-sys -> option-ext.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Build time only: tauri-codegen, through tauri-build and tauri-macros, via dom_query.
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
]

[licenses.private]
# Sonara's own crates are unpublished (see LICENSE: 0BSD).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
